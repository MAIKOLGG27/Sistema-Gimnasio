version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: gimnasio-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: Sistema-Gimnasio-Pago
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  pago-servicio:
    build: .
    container_name: pago-servicio
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/Sistema-Gimnasio-Pago
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_SECURITY_USER_NAME: admin
      SPRING_SECURITY_USER_PASSWORD: "1234"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
