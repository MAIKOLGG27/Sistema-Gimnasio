version: '3.8'
services:
  mysql:
    image: mysql:8.0
    container_name: reserva-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: gym_reservas
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
  reserva-servicio:
    build: .
    container_name: reserva-servicio
    ports:
      - "8088:8088"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/gym_reservas
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      CLIENTE_SERVICE_URL: http://host.docker.internal:8087
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data: